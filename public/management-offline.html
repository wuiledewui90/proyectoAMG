<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#071b33" />
    <title>AMG Gestión · Sin conexión</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        background: radial-gradient(circle at top, #12345a 0, #071b33 38%, #030b14 100%);
        color: white;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(100%, 420px);
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 28px;
        padding: 30px;
        background: rgba(5,20,38,.86);
        box-shadow: 0 28px 80px rgba(0,0,0,.35);
        text-align: center;
      }
      img { width: 160px; height: auto; }
      h1 { margin: 24px 0 10px; font-size: 26px; }
      p { margin: 0; color: rgba(255,255,255,.72); line-height: 1.55; }
      button {
        width: 100%;
        min-height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 14px;
        background: #0878f9;
        color: white;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/documents/amg-logo-ui.webp" alt="AMG Radiadores" />
      <h1>Sin conexión a Internet</h1>
      <p>Los cambios permanecen protegidos. Cuando recuperes la conexión, volvé a intentar ingresar al panel.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
