# Hostinger copies the standalone output; package links must not be required.
nodeLinker: hoisted
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  lodash: ^4.17.23
  picomatch: 4.0.7
  browserslist: 4.29.3
  baseline-browser-mapping: 2.11.27
  effect: 3.20.0
  defu: 6.1.7
  deepmerge-ts: 8.0.2
  yaml: 2.9.1
  uuid: 11.1.1
  postcss-selector-parser: 7.1.6
  esbuild: 0.28.2
  'brace-expansion@<2.0.0': 1.1.21
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.7
